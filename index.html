<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Inventory Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Product Inventory Manager</h1>
        <p>TypeScript Based Inventory System</p>
    </header>


    <main>

        <!-- Statistics -->

        <section class="stats">

            <div class="stat-card">
                <h2 id="totalProducts">0</h2>
                <p>Total Products</p>
            </div>

            <div class="stat-card">
                <h2 id="availableProducts">0</h2>
                <p>Available Products</p>
            </div>

        </section>


        <!-- Search -->

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search product..."
            >

        </section>


        <!-- Products -->

        <section>

            <h2>Product Inventory</h2>

            <div id="productList"
                 class="product-list">
            </div>

        </section>

    </main>


    <footer>

        <p>
            Product Inventory Manager
            | Built using TypeScript
        </p>

    </footer>


    <!-- Compiled JavaScript -->

    <script src="dist/inventory.js"></script>

</body>

</html>
